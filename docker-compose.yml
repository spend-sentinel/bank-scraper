version: "3.8"
services:
  spend-sentinel-bank-scraper:
    build: .
    container_name: spend-sentinel-bank-scraper
    environment:
      - TRANSACTION_API_URL=http://transaction-api:8080
    env_file:
      - ./secrets/loginInformation.env
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN

networks:
  app-network:
    external:
      name: spend-sentinel-app-network